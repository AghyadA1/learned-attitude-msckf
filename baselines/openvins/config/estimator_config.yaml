%YAML:1.0

# Locked starting point: official OpenVINS v2.7 EuRoC defaults.
# Deliberate changes: monocular cam0, no persistent SLAM features, serial
# OpenCV execution. No pose/feature/noise parameter was tuned on V2.
verbosity: "WARNING"
use_fej: true
integration: "rk4"
use_stereo: false
max_cameras: 1

calib_cam_extrinsics: true
calib_cam_intrinsics: true
calib_cam_timeoffset: true
calib_imu_intrinsics: false
calib_imu_g_sensitivity: false

max_clones: 11
max_slam: 0
max_slam_in_update: 25
max_msckf_in_update: 40
dt_slam_delay: 1
gravity_mag: 9.81

feat_rep_msckf: "GLOBAL_3D"
feat_rep_slam: "ANCHORED_MSCKF_INVERSE_DEPTH"
feat_rep_aruco: "ANCHORED_MSCKF_INVERSE_DEPTH"

# Development-only initializer correction: use the upstream beginning-only
# zero-velocity mode so static initialization can occur at any later
# sensor-detected stationary interval, without GT or a sequence timestamp.
try_zupt: true
zupt_chi2_multipler: 0
zupt_max_velocity: 0.1
zupt_noise_multiplier: 10
zupt_max_disparity: 0.5
zupt_only_at_beginning: true

init_window_time: 2.0
init_imu_thresh: 1.5
# Stricter than the stereo EuRoC default (10 px) to avoid treating slow,
# approximately constant-velocity monocular motion as a stationary interval.
init_max_disparity: 2.0
init_max_features: 50
# Dynamic initialization was evaluated on development data, but its short
# monocular solve was rank-deficient or inaccurate on several Machine Hall
# sequences. The selected locked rule therefore uses robust static
# initialization at a later stationary interval.
init_dyn_use: false
init_dyn_mle_opt_calib: false
init_dyn_mle_max_iter: 50
init_dyn_mle_max_time: 0.05
init_dyn_mle_max_threads: 6
init_dyn_num_pose: 6
init_dyn_min_deg: 10.0
init_dyn_inflation_ori: 10
init_dyn_inflation_vel: 100
init_dyn_inflation_bg: 10
init_dyn_inflation_ba: 100
init_dyn_min_rec_cond: 1e-12
init_dyn_bias_g: [0.0, 0.0, 0.0]
init_dyn_bias_a: [0.0, 0.0, 0.0]

record_timing_information: false
record_timing_filepath: "/tmp/clean_msckf_openvins_timing.txt"
save_total_state: false
filepath_est: "/tmp/clean_msckf_openvins_estimate.txt"
filepath_std: "/tmp/clean_msckf_openvins_std.txt"
filepath_gt: "/tmp/clean_msckf_openvins_unused_gt.txt"

use_klt: true
num_pts: 200
fast_threshold: 20
grid_x: 5
grid_y: 5
min_px_dist: 10
knn_ratio: 0.70
track_frequency: 21.0
downsample_cameras: false
num_opencv_threads: 0
histogram_method: "HISTOGRAM"

use_aruco: false
num_aruco: 1024
downsize_aruco: true

up_msckf_sigma_px: 1
up_msckf_chi2_multipler: 1
up_slam_sigma_px: 1
up_slam_chi2_multipler: 1
up_aruco_sigma_px: 1
up_aruco_chi2_multipler: 1
use_mask: false

relative_config_imu: "kalibr_imu_chain.yaml"
relative_config_imucam: "kalibr_imucam_chain.yaml"
