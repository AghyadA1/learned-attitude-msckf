[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "learned-attitude-msckf"
version = "0.1.0"
description = "Monocular MSCKF on EuRoC with a GRU gyro model, takeoff-aware bias calibration and an OpenVINS baseline"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "opencv-python>=4.8",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
gru = ["torch>=2.1"]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["qvio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
